# Conexão com o MySQL (troque a senha pela senha do SEU MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/capacita_plus?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}

# "update": o Hibernate confere as tabelas e cria o que faltar (não apaga dados)
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL executado (bom para aprender)
spring.jpa.show-sql=true

server.port=8080
